<!DOCTYPE html>
<html lang="en">
  <head>
    <title>FlashCards</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href="./styles.css">
  </head>
  <body>
    <p id="card-display">
        
    </p>
    
    <div id="bottom-row">
      <div id="study-controls">
            <button id="flip-btn">Flip</button>
            <button id="prev-btn">Previous</button>
            <button id="next-btn">Next</button>
            <button id="restart-btn" hidden>Restart</button>
            <button id="got-btn">Got it</button>
            <button id="miss-btn">Missed it</button>
            <p id="mastered-card-count"></p>

      </div>
    </div>
    <form id="card-form">
        <label for="question-input">Question: </label><input type="text" id="question-input">
        <label for="answer-input">Answer: </label><input type="text" id="answer-input">
        <button id="submit-btn">Submit</button>
    </form>

   <script src="./script.js"></script>
   </body>
</html>
